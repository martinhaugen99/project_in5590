; M.A.T.S firmware for the Arduino Leonardo (D013, D020). Run every command through uv from
; the repository root:
;   uv run pio run -d firmware                 build
;   uv run pio run -d firmware -t upload       flash (hardware action)
;   uv run pio device monitor -d firmware      serial console

[platformio]
; A plain build or upload uses only the full build with every interlock.
default_envs = leonardo

[env:leonardo]
; atmelavr 5.3.0 (PlatformIO registry, released 2026-06-23).
platform = platformio/atmelavr@5.3.0
board = leonardo
framework = arduino

; Our own sources: C++17 (D013), and any warning fails the build. The framework and the
; libraries keep the standard the framework sets (gnu++11, builder/frameworks/arduino.py).
; -std=gnu++17 goes here, where it comes last on the command line for files in src/.
; C++14 and later call the sized operator delete, which the core defines only when it is built
; as C++14 or later (cores/arduino/new.cpp). -fno-sized-deallocation keeps the plain one.
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -std=gnu++17
    -fno-sized-deallocation

lib_deps =
    adafruit/Adafruit ILI9341@1.7.0
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    ; Servo 1.3.0 (PlatformIO registry, released 2025-11-06). Uses Timer1 on the ATmega32U4.
    arduino-libraries/Servo@1.3.0
    ; Installed as dependencies of Adafruit ILI9341. Not used, pinned so installs repeat.
    adafruit/Adafruit STMPE610@1.1.6
    adafruit/Adafruit TouchScreen@1.1.6
    adafruit/Adafruit TSC2007@1.1.2
    adafruit/Adafruit SH110X@2.1.15

monitor_speed = 115200
monitor_echo = yes

; Bench build for testing the servos with no edge sensors connected. The bucket may move with
; only the tracks stopped (safety::bucket_may_move()). Never flash it onto the full robot.
;   uv run pio run -d firmware -e leonardo_bench -t upload
[env:leonardo_bench]
extends = env:leonardo
build_src_flags =
    ${env:leonardo.build_src_flags}
    -DMATS_BENCH_NO_DUMP_INTERLOCK
