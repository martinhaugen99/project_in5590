; M.A.T.S firmware (D013). Run every command through uv from the repository root:
;   uv run pio run -d firmware                 build
;   uv run pio run -d firmware -t upload       flash (hardware action)
;   uv run pio device monitor -d firmware      serial console

[env:nano_esp32]
platform = platformio/espressif32@8.0.0
board = arduino_nano_esp32
framework = arduino

; BOARD_USES_HW_GPIO_NUMBERS turns off the Arduino pin remap of the board, so D2 means GPIO5
; everywhere, also inside libraries (include/pins.h checks this at compile time).
; CORE_DEBUG_LEVEL=0 keeps core log output off UART0 TX, which is D1 (actuator input).
build_flags =
    -DBOARD_USES_HW_GPIO_NUMBERS
    -DCORE_DEBUG_LEVEL=0

; Our own sources: C++17 (D013), and any warning fails the build. The framework and the
; libraries keep the standard the framework sets (gnu++2b). build_unflags cannot remove it, so
; -std=gnu++17 goes here, where it comes last on the command line for files in src/.
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -std=gnu++17

lib_deps =
    adafruit/Adafruit ILI9341@1.7.0
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    stm32duino/STM32duino VL53L4CD@1.0.5
    ; Installed as dependencies of Adafruit ILI9341. Not used, pinned so installs repeat.
    adafruit/Adafruit STMPE610@1.1.6
    adafruit/Adafruit TouchScreen@1.1.6
    adafruit/Adafruit TSC2007@1.1.2
    adafruit/Adafruit SH110X@2.1.15

monitor_speed = 115200
