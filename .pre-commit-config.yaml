# Install once per clone: uv run pre-commit install
# Run on all tracked files: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=3000"] # docs/figures/archive/archive-sketch.png is 2.3 MB

  # Local hooks run the tool versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
